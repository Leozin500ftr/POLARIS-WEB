<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Polaris</title>
<link rel="stylesheet" href="style.css">
<style>
/* Wrapper para o campo de senha com botão olho */
.senha-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    margin: 10px 0;
}

.senha-wrapper input {
    margin: 0;
    padding-right: 44px;
}

.toggle-senha {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 17px;
    opacity: 0.4;
    padding: 0;
    width: auto;
    margin: 0;
    display: flex;
    align-items: center;
    transition: opacity 0.2s ease, transform 0.2s ease;
    line-height: 1;
}

.toggle-senha:hover {
    opacity: 0.85;
    transform: scale(1.15);
}
</style>
</head>

<body>

<div class="card">

    <h2>Criar Novo Usuário</h2>

    <input type="text" id="novoUsuario" placeholder="Usuário">
    <input type="email" id="novoEmail" placeholder="E-mail">

    <div class="senha-wrapper">
        <input type="password" id="novaSenha" placeholder="Senha">
        <button type="button" class="toggle-senha" onclick="alternarSenhaVisivel('novaSenha', this)" title="Mostrar/ocultar senha">👁️</button>
    </div>

    <button class="login" onclick="criarUsuario()">Cadastrar</button>
    <button class="cadastro" onclick="voltar()">Voltar</button>

</div>

<div class="toast" id="toast"></div>

<script>

function alternarSenhaVisivel(inputId, btn) {
    const input = document.getElementById(inputId);
    const visivel = input.type === 'text';
    input.type = visivel ? 'password' : 'text';
    btn.textContent = visivel ? '👁️' : '🙈';
    btn.style.opacity = visivel ? '0.4' : '0.75';
}

function criarUsuario(){

    let usuario = document.getElementById("novoUsuario").value.trim().toLowerCase();
    let email = document.getElementById("novoEmail").value.trim().toLowerCase();
    let senha = document.getElementById("novaSenha").value;

    if(usuario === "" || email === "" || senha === ""){
        mostrarToast("Preencha todos os campos!", true);
        return;
    }

    // ✅ Validação de e-mail
    let regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(!regexEmail.test(email)){
        mostrarToast("Digite um e-mail válido!", true);
        return;
    }

    // 🔐 Validação de senha forte
    let regexSenha = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

    if(!regexSenha.test(senha)){
        mostrarToast("Senha fraca! Mínimo 8 caracteres, 1 maiúscula, 1 número e 1 especial.", true);
        return;
    }

    let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

    // 🚫 Verifica usuário duplicado
    let usuarioExistente = usuarios.find(u => u.usuario === usuario);
    if(usuarioExistente){
        mostrarToast("Este usuário já existe!", true);
        return;
    }

    // 🚫 Verifica e-mail duplicado
    let emailExistente = usuarios.find(u => u.email === email);
    if(emailExistente){
        mostrarToast("Este e-mail já está cadastrado!", true);
        return;
    }

    usuarios.push({
        usuario: usuario,
        email: email,
        senha: senha
    });

    localStorage.setItem("usuarios", JSON.stringify(usuarios));
    localStorage.setItem("usuarioCriado", "true");

    mostrarToast("Usuário cadastrado com sucesso!");

    setTimeout(() => {
        window.location.href = "index.html";
    }, 1000);
}

function voltar(){
    window.location.href = "index.html";
}

function mostrarToast(mensagem, erro=false){
    let toast = document.getElementById("toast");

    toast.innerText = mensagem;
    toast.classList.remove("error");

    if(erro){
        toast.classList.add("error");
    }

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 3000);
}

</script>

<script src="logger.js"></script>
</body>
</html>
